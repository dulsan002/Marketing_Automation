<header
  class="flex items-center justify-between p-4 h-20 bg-white/70 backdrop-blur-xl supports-[backdrop-filter]:bg-white/60 border-b border-white/40 shadow-sm shrink-0 z-10 sticky top-0">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">{{ title() }}</h1>
    <p class="text-sm text-gray-500">{{ description() }}</p>
  </div>
  <div class="flex items-center space-x-6">
    <div class="relative">
      <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor"
        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <input type="text" placeholder="Search..."
        class="pl-10 pr-4 py-2 w-64 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <button class="text-gray-500 hover:text-gray-700 relative">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
        </path>
      </svg>
      <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-white"></span>
    </button>
    <div class="flex items-center">
      <img class="h-10 w-10 rounded-full object-cover" src="https://i.pravatar.cc/100" alt="User avatar">
    </div>
  </div>
</header>
