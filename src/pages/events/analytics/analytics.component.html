<div class="space-y-8">
  <div class="flex justify-end no-print">
    <button onclick="window.print()" title="Print Report"
      class="p-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 bg-white shadow-sm transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z">
        </path>
      </svg>
    </button>
  </div>
  @if (analytics(); as data) {
  <!-- KPIs -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex items-start justify-between">
      <div>
        <p class="text-sm font-medium text-gray-500">Total Events</p>
        <p class="text-3xl font-bold text-gray-900 mt-2">{{ data.totalEvents }}</p>
      </div>
      <div class="p-3 bg-sky-100 rounded-lg">
        <svg class="w-6 h-6 text-sky-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0h18" />
        </svg>
      </div>
    </div>
    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex items-start justify-between">
      <div>
        <p class="text-sm font-medium text-gray-500">Total Registrations</p>
        <p class="text-3xl font-bold text-gray-900 mt-2">{{ data.totalRegistrations | number }}</p>
      </div>
      <div class="p-3 bg-teal-100 rounded-lg">
        <svg class="w-6 h-6 text-teal-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m-7.5-2.928A3 3 0 017.5 15.25m0-4.01a3 3 0 013-3m0 0a3 3 0 013 3m0 0a3 3 0 01-3 3m0 0a3 3 0 01-3-3m2.25 6H12m-2.25-6l-2.25-2.25" />
        </svg>
      </div>
    </div>
    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex items-start justify-between">
      <div>
        <p class="text-sm font-medium text-gray-500">Total Attendees</p>
        <p class="text-3xl font-bold text-gray-900 mt-2">{{ data.totalAttendees | number }}</p>
      </div>
      <div class="p-3 bg-green-100 rounded-lg">
        <svg class="w-6 h-6 text-green-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
      </div>
    </div>
    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex items-start justify-between">
      <div>
        <p class="text-sm font-medium text-gray-500">No-Shows</p>
        <p class="text-3xl font-bold text-gray-900 mt-2">{{ data.noShows | number }}</p>
      </div>
      <div class="p-3 bg-red-100 rounded-lg">
        <svg class="w-6 h-6 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Chart -->
  <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
    <h3 class="text-lg font-semibold text-gray-900">Attendance by Event</h3>
    <div class="h-96 mt-4">
      <app-bar-chart [data]="chartData()"></app-bar-chart>
    </div>
  </div>
  } @else {
  <div class="text-center p-12">
    <p>Loading analytics...</p>
  </div>
  }
</div>
