<div class="login-container">
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 700;">MAP Login</h1>
            <p style="color: #6b7280;">Sign in to access your dashboard</p>
        </div>

        <div *ngIf="error()" class="error-msg">
            {{ error() }}
        </div>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="tenant">Organization ID (Slug)</label>
                <input type="text" id="tenant" [(ngModel)]="tenantSlug" name="tenantSlug" placeholder="e.g. acme-corp"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="admin@example.com"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••"
                    required>
            </div>

            <button type="submit" [disabled]="isLoading">
                <span *ngIf="!isLoading">Sign In</span>
                <span *ngIf="isLoading">Verifying...</span>
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: #6b7280;">
            <p>Dev Credentials: admin@example.com / admin123</p>
        </div>
    </div>
</div>
