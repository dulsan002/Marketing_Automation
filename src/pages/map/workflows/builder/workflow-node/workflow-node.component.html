@if(node(); as n) {
  <div 
    (click)="selectNode.emit($event)" 
    class="node-card" 
    [class]="getNodeColorClass(n.type)"
    [class.selected]="selectedNodeId() === n.id"
    [class.dashed-border]="n.type === 'Trigger'">
    @if (n.type === 'Trigger') { <span class="node-badge">TRIGGER</span> }
    <div class="flex items-center">
      <div class="p-2 rounded-md mr-3"><svg class="w-6 h-6" [class]="getNodeTextColor(n.type)" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" [innerHTML]="nodeIcon()"></svg></div>
      <div>
          <p class="font-semibold text-sm text-gray-800">{{ n.settings.nodeName }}</p>
          <p class="text-xs text-gray-500">{{ n.settings['selectCampaign'] || n.settings['segmentId'] || (n.subType === 'Wait / Delay' ? n.settings['waitDurationValue'] + ' ' + n.settings['waitDurationUnit'] : '') }}</p>
      </div>
    </div>
  </div>
}
