@if(node(); as n) {
<div class="node-card group" [class.selected]="isSelected()" (click)="onNodeClick($event)" title="Click to configure">
  <!-- Status Indicator & Trigger Badge -->
  @if(n.isTrigger) { <div class="node-badge">TRIGGER</div> }

  <!-- Content -->
  <div class="flex items-start gap-3">
    <!-- Icon Container -->
    <div
      class="w-10 h-10 rounded-xl bg-white shadow-sm border border-zinc-200 flex items-center justify-center shrink-0 text-zinc-500 group-hover:text-black group-hover:border-zinc-300 group-hover:scale-105 transition-all duration-300">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"
        [innerHTML]="nodeIcon()"></svg>
    </div>

    <!-- Text Info -->
    <div class="flex-grow min-w-0 pt-0.5">
      <h4 class="font-bold text-sm text-zinc-900 leading-tight truncate pr-2 group-hover:text-black transition-colors">
        {{ n.settings.nodeName }}</h4>
      @if(getNodeSummary(); as summary) {
      <p
        class="text-[11px] text-zinc-500 font-medium leading-snug line-clamp-2 mt-0.5 opacity-90 group-hover:text-zinc-600 transition-colors">
        {{ summary }}</p>
      } @else {
      <p class="text-[10px] text-zinc-400 italic mt-0.5">Not configured</p>
      }
    </div>

    <!-- Menu Icon (Visual only) -->
    <div class="hidden group-hover:block absolute top-2 right-2 text-zinc-400 hover:text-zinc-600 transition-colors">
      <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z" />
      </svg>
    </div>
  </div>
</div>
}
